# NonNewtonian Physicists journald limits. install.sh copies this to
# /etc/systemd/journald.conf.d/nnp.conf and restarts systemd-journald.
#
# The app's error log (gunicorn errorlog, which can include an IP address)
# goes to the journal. The privacy page (templates/privacy.html) promises it
# "is kept for a few weeks", so BOTH limits are needed: the size cap alone
# keeps a quiet box's log for months. Change one only together with that copy.
[Journal]
SystemMaxUse=200M
MaxRetentionSec=1month
